# Serveur statique du site Le Mondrian.
# TLS, HTTP -> HTTPS et certificat Let's Encrypt sont gérés en amont par
# le proxy Traefik de Coolify : ce conteneur n'écoute que sur le port 80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Derrière le proxy HTTPS de Coolify : les redirections de répertoire
    # (/presentation -> /presentation/) restent relatives et conservent le HTTPS.
    absolute_redirect off;

    # Compression des ressources textuelles (les JPEG n'en ont pas besoin).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # En-têtes de sécurité appliqués à toutes les réponses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sonde de santé utilisée par Docker et Coolify.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Manifeste interne du build : jamais servi publiquement.
    location = /.mondrian-static.json {
        return 404;
    }

    # Pages HTML : revalidation systématique pour publier les mises à jour tout de suite.
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Feuilles de style, scripts et icônes : 1 heure.
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    # Photographies optimisées : 30 jours.
    location /images/ {
        expires 30d;
        try_files $uri =404;
    }

    # /presentation, /services et /contact sont des répertoires : nginx
    # redirige alors automatiquement vers /presentation/ et sert index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }
}
